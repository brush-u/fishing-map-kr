name: Deploy to Cloud Run

# main 브랜치에 push될 때마다 자동으로 Google Cloud Run에 배포합니다.
# 필요한 준비물(서비스 계정, GitHub Secrets 등)은 README.md의
# "③ Google Cloud — 자동배포(CI/CD)" 섹션을 참고하세요.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행할 수 있게

env:
  SERVICE_NAME: fishing-map-kr
  REGION: asia-northeast3

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Google Cloud 인증
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: gcloud CLI 설정
        uses: google-github-actions/setup-gcloud@v2

      # GitHub Secrets에 키를 아직 등록하지 않았다면 비어있는 값이 들어오는데, 그 상태로
      # --set-env-vars 에 "KEY=" 를 그대로 넘기면 기존에 (예: npm run deploy로) 이미 설정해둔
      # 실제 키 값을 빈 값으로 덮어써서 지워버립니다. 그래서 값이 있는 키만 골라서 넘기고,
      # 하나도 없으면 --set-env-vars 자체를 아예 생략해서 기존 환경변수를 그대로 둡니다.
      - name: 환경변수 조립 (설정된 값만, 비어있으면 기존 값을 지우지 않음)
        id: envvars
        run: |
          PAIRS=""
          add_if_set() {
            if [ -n "$2" ]; then
              PAIRS="${PAIRS:+$PAIRS,}$1=$2"
            fi
          }
          add_if_set KMA_FORECAST_KEY "${{ secrets.KMA_FORECAST_KEY }}"
          add_if_set KHOA_TIDE_KEY "${{ secrets.KHOA_TIDE_KEY }}"
          add_if_set KHOA_FISHING_INDEX_KEY "${{ secrets.KHOA_FISHING_INDEX_KEY }}"
          add_if_set KAKAO_REST_API_KEY "${{ secrets.KAKAO_REST_API_KEY }}"
          if [ -z "$PAIRS" ]; then
            echo "::warning::GitHub Secrets에 API 키가 하나도 설정되어 있지 않아, 이번 배포에서는 환경변수를 건드리지 않습니다. (Settings > Secrets and variables > Actions 에서 등록해주세요)"
          fi
          echo "pairs=$PAIRS" >> "$GITHUB_OUTPUT"

      - name: Cloud Run에 배포
        run: |
          if [ -n "${{ steps.envvars.outputs.pairs }}" ]; then
            gcloud run deploy "$SERVICE_NAME" \
              --source . \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --region "$REGION" \
              --allow-unauthenticated \
              --quiet \
              --set-env-vars "${{ steps.envvars.outputs.pairs }}"
          else
            gcloud run deploy "$SERVICE_NAME" \
              --source . \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --region "$REGION" \
              --allow-unauthenticated \
              --quiet
          fi

      - name: 배포된 URL 출력
        run: |
          echo "### 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "${{ secrets.GCP_PROJECT_ID }}" --format 'value(status.url)')
          echo "- 서비스 URL: $URL" >> "$GITHUB_STEP_SUMMARY"
