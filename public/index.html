<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>대한민국 낚시지도</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="vendor/leaflet.markercluster/MarkerCluster.css" />
<link rel="stylesheet" href="vendor/leaflet.markercluster/MarkerCluster.Default.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <h1>🎣 대한민국 낚시지도</h1>
    <div id="region-nav" class="hidden">
      <button id="btn-back">← 전체 권역 보기</button>
      <span id="region-title"></span>
      <span id="region-weather"></span>
    </div>
    <div id="search-box">
      <input type="text" id="search-input" placeholder="🔍 낚시터 이름으로 검색..." autocomplete="off" />
      <div id="search-results" class="hidden"></div>
    </div>
    <div id="filters">
      <label><input type="checkbox" id="f-sea" checked /> 바다</label>
      <label><input type="checkbox" id="f-freshwater" checked /> 민물</label>
      <label><input type="checkbox" id="f-boat" checked /> 🚤 배낚시</label>
      <label class="disabled"><input type="checkbox" id="f-lifestyle" disabled /> 생활낚시 (준비중)</label>
    </div>
  </header>

  <div id="map-area">
    <div id="map"></div>
    <p id="hint">권역을 클릭하면 해당 권역의 낚시포인트가 모두 표시됩니다.</p>

    <div id="spot-list" class="hidden">
      <div id="spot-list-header">
        <div id="spot-list-handle" aria-hidden="true"></div>
        <div id="spot-list-title"></div>
        <div id="spot-list-chips">
          <button type="button" class="chip chip-sea active" data-type="sea">🎣 바다</button>
          <button type="button" class="chip chip-freshwater active" data-type="freshwater">🐟 민물</button>
          <button type="button" class="chip chip-boat active" data-type="boat">🚤 배낚시</button>
        </div>
      </div>
      <div id="spot-list-body"></div>
    </div>

    <button id="spot-list-reopen" class="hidden" type="button">🎣 목록 다시 보기</button>

    <div id="panel" class="hidden">
      <button id="panel-close">&times;</button>
      <button id="panel-to-region-view">🗺 전체 권역 보기</button>
      <h2 id="panel-title">-</h2>
      <p id="panel-meta"></p>

      <section>
        <h3>날씨</h3>
        <div id="panel-weather">불러오는 중...</div>
      </section>

      <section>
        <h3>물때</h3>
        <div id="panel-tide">불러오는 중...</div>
        <div id="tide-obscode-row">
          <input type="text" id="tide-obscode" placeholder="다른 관측소로 보기 (예: DT_0001, 선택사항)" />
          <button id="tide-obscode-apply">조회</button>
        </div>
        <p class="tide-hint">가장 가까운 관측소가 자동으로 선택됩니다. 다른 관측소 값을 보고 싶을 때만 코드를 직접 입력하세요.
          <a href="https://www.data.go.kr/data/15146602/fileData.do" target="_blank" rel="noopener">관측소 목록 보기</a></p>
      </section>

      <section>
        <h3>주변 편의점 / 상점</h3>
        <div id="panel-nearby">불러오는 중...</div>
      </section>

      <section class="coming-soon">
        <h3>생활낚시 정보 <span class="badge">준비중</span></h3>
        <p>도심 인근 접근성, 주차, 화장실, 초심자 난이도 등 생활낚시 관련 정보가 추후 이 자리에 표시됩니다.</p>
      </section>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
